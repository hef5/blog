spring:
  datasource:
    # Read from environment variables, defaulting to 'hefeng' only if not set
    username: ${DB_USER:hefeng}
    password: ${DB_PASS:hefeng}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cloud:
    gcp:
      sql:
        database-name: ${DB_NAME:blog_product}
        # Must be injected via environment variable CLOUD_SQL_INSTANCE
        instance-connection-name: ${CLOUD_SQL_INSTANCE}
        enabled: true
      # Removed manual credentials location to leverage Cloud Run's automatic Service Account identity
      logging:
        enabled: true
server:
  port: 8080
  address: 0.0.0.0







